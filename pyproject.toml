[project]
name = "pdfs-review"
version = "0.2.0"
description = "Review PDF pages in a folder and nested ZIP, 7z and RAR archives."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-or-later"
dependencies = [
    "pymupdf==1.26.5",
    "openpyxl==3.1.5",
    "py7zr==1.1.3",
    "rarfile==4.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
