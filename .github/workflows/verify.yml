name: Portable Windows and PDF regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare checksum-verified build uv
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pin=(Get-Content portable/pins.json -Raw|ConvertFrom-Json).uv
          $archive=Join-Path $env:RUNNER_TEMP 'uv.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $pin.url -OutFile $archive
          if((Get-FileHash $archive).Hash.ToLowerInvariant() -ne $pin.archive_sha256){throw 'uv archive hash mismatch'}
          $tools=Join-Path $env:RUNNER_TEMP 'uv-tools'
          Expand-Archive $archive $tools
          if((Get-FileHash (Join-Path $tools 'uv.exe')).Hash.ToLowerInvariant() -ne $pin.exe_sha256){throw 'uv executable hash mismatch'}
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build deterministic source-only ZIP
        run: python scripts/build_portable.py --release
      - name: Prepare synthetic acceptance fixtures
        shell: powershell
        run: |
          uv sync --frozen --no-dev
          if($LASTEXITCODE){exit $LASTEXITCODE}
          uv run --frozen python scripts/make_test_fixtures.py dist/windows-fixtures.zip
          exit $LASTEXITCODE
      - name: Fresh setup, offline restarts, isolation and relocation
        shell: powershell
        run: ./tests/windows_portable.ps1 -Zip ./dist/pdfs-review-windows-x64.zip -Fixtures ./dist/windows-fixtures.zip -Results ./dist/acceptance.json
      - name: All source regression tests
        shell: powershell
        run: |
          $case=Get-ChildItem dist -Directory -Filter acceptance-*|Sort-Object CreationTime -Descending|Select-Object -First 1
          $tool=Join-Path $case.FullName ('tool '+[char]0x00e9)
          $env:PATH=(Join-Path $tool 'support/state/backend')+';'+$env:PATH
          uv run --frozen python -m unittest discover -s tests -v
          exit $LASTEXITCODE
